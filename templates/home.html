<!-- templates/home.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact List System</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f6f9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

    <h1> ContactList </h1>
    <p>Viewing mock application layout baseline data.</p>

    <table>
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Email Address</th>
                <th>Phone Number</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loop through list -->
            {% for contact in contacts %}
            <tr>
                <td><strong>{{ contact.name }}</strong></td>
                <td>{{ contact.email }}</td>
                <td>{{ contact.phone }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">No contact listings found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
